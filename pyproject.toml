[project]
name = "solo-pf2e-table"
version = "0.1.0"
description = "Offline-first solo Pathfinder toolkit"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "sqlmodel>=0.0.22",
  "pyyaml>=6.0",
  "python-multipart>=0.0.9",
  "markdown>=3.6",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "httpx>=0.27",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
